
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a0f;display:flex;align-items:center;justify-content:center;min-height:640px;font-family:'Segoe UI',sans-serif}
#wrap{position:relative;width:680px;height:580px;overflow:hidden}
canvas{display:block;cursor:crosshair}
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;padding:9px 13px;display:flex;justify-content:space-between;align-items:flex-start;display:none}
#hud-left{display:flex;flex-direction:column;gap:4px}
#hp-label{font-size:9px;font-weight:700;letter-spacing:1.5px;color:#aaa}
#hp-track{width:168px;height:10px;background:rgba(0,0,0,0.75);border:1px solid #444;border-radius:5px;overflow:hidden}
#hp-bar{height:100%;width:100%;border-radius:4px;transition:width .12s,background .3s}
#char-tag{font-size:10px;font-weight:800;letter-spacing:1px;margin-top:3px}
#ability-tag{font-size:9px;color:#888;letter-spacing:.5px}
#weapon-row{display:flex;gap:4px;margin-top:5px}
.ws{width:36px;height:34px;border:1.5px solid #2a2a2a;border-radius:4px;background:rgba(0,0,0,0.6);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .12s}
.ws.on{border-color:#fbbf24;background:rgba(251,191,36,0.1)}
.ws-k{font-size:8px;color:#666;line-height:1;font-weight:700}
.ws-n{font-size:6.5px;font-weight:700;letter-spacing:.3px;line-height:1.3;text-align:center}
#hud-right{text-align:right}
#score-el{font-size:21px;font-weight:900;color:#fbbf24;text-shadow:0 0 8px #f59e0b;line-height:1}
#wave-el{font-size:9px;color:#777;letter-spacing:1.5px;font-weight:700;margin-top:2px}
#wpn-el{font-size:10px;font-weight:800;letter-spacing:1px;margin-top:3px}

#screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,7,12,0.95);z-index:30;pointer-events:all}
.title{font-size:34px;font-weight:900;letter-spacing:4px;color:#ef4444;text-shadow:0 0 22px #ef4444;margin-bottom:3px}
.subtitle{font-size:10px;letter-spacing:3px;color:#555;margin-bottom:18px}
.pick-label{font-size:10px;letter-spacing:2px;color:#888;margin-bottom:12px;font-weight:700}
#chars-grid{display:flex;gap:8px;margin-bottom:18px}
.ccard{width:108px;background:rgba(255,255,255,0.04);border:1.5px solid #2a2a2a;border-radius:8px;padding:10px 8px 9px;cursor:pointer;text-align:center;transition:all .18s;pointer-events:all}
.ccard:hover{border-color:#666;background:rgba(255,255,255,0.07);transform:translateY(-2px)}
.ccard.sel{border-color:#fbbf24;background:rgba(251,191,36,0.1);transform:translateY(-2px)}
.ccard-icon{font-size:28px;margin-bottom:5px;line-height:1}
.ccard-name{font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:4px}
.ccard-stat{font-size:8.5px;color:#666;letter-spacing:.3px;line-height:1.5}
.ccard-ability{font-size:7.5px;margin-top:5px;padding:3px 5px;border-radius:3px;font-weight:700;letter-spacing:.3px}
.go-btn{padding:12px 42px;font-size:13px;font-weight:800;letter-spacing:2px;background:transparent;border:2px solid #ef4444;color:#ef4444;cursor:pointer;border-radius:3px;transition:all .18s;pointer-events:all;opacity:.4}
.go-btn.ready{opacity:1}
.go-btn:hover{background:#ef4444;color:#000}
.hint{font-size:9.5px;color:#444;margin-top:14px;line-height:2;text-align:center}
.hint b{color:#fbbf24}
.go-stat{font-size:14px;color:#fbbf24;font-weight:700;margin:3px 0 22px;letter-spacing:1px}
</style>
<div id="wrap">
  <canvas id="c" width="680" height="580"></canvas>
  <div id="hud">
    <div id="hud-left">
      <div id="hp-label">HP</div>
      <div id="hp-track"><div id="hp-bar"></div></div>
      <div id="char-tag"></div>
      <div id="ability-tag"></div>
      <div id="weapon-row">
        <div class="ws on" id="ws0"><span class="ws-k">1</span><span class="ws-n" style="color:#fde047">AK47</span></div>
        <div class="ws" id="ws1"><span class="ws-k">2</span><span class="ws-n" style="color:#fb923c">T56</span></div>
        <div class="ws" id="ws2"><span class="ws-k">3</span><span class="ws-n" style="color:#f1f5f9">SNP</span></div>
        <div class="ws" id="ws3"><span class="ws-k">4</span><span class="ws-n" style="color:#7dd3fc">SMG</span></div>
      </div>
    </div>
    <div id="hud-right">
      <div id="score-el">0</div>
      <div id="wave-el">WAVE 1</div>
      <div id="wpn-el" style="color:#fde047">AK-47</div>
    </div>
  </div>
  <div id="screen"></div>
</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=680,H=580;
const hudEl=document.getElementById('hud');
const hpBarEl=document.getElementById('hp-bar');
const scoreEl=document.getElementById('score-el');
const waveEl=document.getElementById('wave-el');
const wpnEl=document.getElementById('wpn-el');
const charTagEl=document.getElementById('char-tag');
const abilTagEl=document.getElementById('ability-tag');
const screenEl=document.getElementById('screen');

const CHARS=[
  {id:'alok',  name:'ALOK',   icon:'🕶️', color:'#60a5fa', ability:'HP Regen +1/2s',    abilShort:'REGEN',   maxHp:100, spdMult:1,   dmgMult:1,   hpPackHeal:25, desc:'Balanced. Slow HP regen.'},
  {id:'kelly', name:'KELLY',  icon:'⚡',  color:'#34d399', ability:'+30% Move Speed',   abilShort:'SPEED',   maxHp:100, spdMult:1.3, dmgMult:1,   hpPackHeal:25, desc:'Fastest movement.'},
  {id:'hayato',name:'HAYATO', icon:'⚔️',  color:'#f87171', ability:'+25% Weapon DMG',   abilShort:'DAMAGE',  maxHp:100, spdMult:1,   dmgMult:1.25,hpPackHeal:25, desc:'Higher weapon damage.'},
  {id:'chrono',name:'CHRONO', icon:'🛡️',  color:'#a78bfa', ability:'Max HP: 150',       abilShort:'TANK',    maxHp:150, spdMult:1,   dmgMult:1,   hpPackHeal:25, desc:'Starts with 150 HP.'},
  {id:'skyler',name:'SKYLER', icon:'💊',  color:'#fbbf24', ability:'Heal Packs +50 HP', abilShort:'HEALER',  maxHp:100, spdMult:1,   dmgMult:1,   hpPackHeal:50, desc:'Double HP pack healing.'},
];
const WPNS=[
  {id:0,name:'AK-47',    cd:4,  dmg:2, spd:15, spread:.055,tracer:'#fde047',sz:2.2,label:'AK47'},
  {id:1,name:'T56 Rifle',cd:10, dmg:4, spd:13, spread:.025,tracer:'#fb923c',sz:2.8,label:'T56'},
  {id:2,name:'Sniper',   cd:40, dmg:99,spd:28, spread:.005,tracer:'#f1f5f9',sz:1.8,label:'SNP'},
  {id:3,name:'Auto SMG', cd:2,  dmg:1, spd:13, spread:.12, tracer:'#7dd3fc',sz:1.6,label:'SMG'},
];
const WC=['#fde047','#fb923c','#f1f5f9','#7dd3fc'];

let G={state:'select',char:null};
let P,bullets,zombies,hpPacks,particles,muzzles,keys,mouse;
let shootCd,spawnCd,packCd,waveTick,score,wave,hp,curWpn,regenTimer;
let raf,selectedChar=null;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd=(a,b)=>a+Math.random()*(b-a);

function showSelectScreen(){
  G.state='select';selectedChar=null;
  hudEl.style.display='none';
  screenEl.style.display='flex';
  screenEl.innerHTML=`
    <div class="title">DEAD LONDON</div>
    <div class="subtitle">CHOOSE YOUR SURVIVOR</div>
    <div class="pick-label">SELECT CHARACTER</div>
    <div id="chars-grid">${CHARS.map(ch=>`
      <div class="ccard" data-id="${ch.id}">
        <div class="ccard-icon">${ch.icon}</div>
        <div class="ccard-name" style="color:${ch.color}">${ch.name}</div>
        <div class="ccard-stat">${ch.desc}</div>
        <div class="ccard-ability" style="background:${ch.color}22;color:${ch.color}">${ch.ability}</div>
      </div>`).join('')}</div>
    <button class="go-btn" id="go-btn">BEGIN MISSION</button>
    <div class="hint"><b>WASD/Arrows</b> Move · <b>Mouse</b> Aim · <b>Hold Click</b> Shoot · <b>1-4</b> Switch Weapon</div>`;
  document.querySelectorAll('.ccard').forEach(el=>{
    el.addEventListener('click',()=>{
      document.querySelectorAll('.ccard').forEach(c=>c.classList.remove('sel'));
      el.classList.add('sel');
      selectedChar=CHARS.find(c=>c.id===el.dataset.id);
      const btn=document.getElementById('go-btn');
      btn.classList.add('ready');
    });
  });
  const btn=document.getElementById('go-btn');
  btn.addEventListener('mouseover',()=>{if(selectedChar){btn.style.background='#ef4444';btn.style.color='#000';}});
  btn.addEventListener('mouseout',()=>{btn.style.background='transparent';btn.style.color='#ef4444';});
  btn.addEventListener('click',()=>{if(selectedChar)startGame(selectedChar);});
}

function initGame(ch){
  const baseSpd=2.7;
  P={x:340,y:290,r:15,spd:baseSpd*ch.spdMult,angle:0,char:ch};
  bullets=[];zombies=[];hpPacks=[];particles=[];muzzles=[];
  keys={};mouse={x:340,y:200,down:false};
  shootCd=0;spawnCd=0;packCd=0;waveTick=0;regenTimer=0;
  score=0;wave=1;hp=ch.maxHp;curWpn=0;
  scoreEl.textContent='0';waveEl.textContent='WAVE 1';
  charTagEl.textContent=ch.name;charTagEl.style.color=ch.color;
  abilTagEl.textContent=ch.abilShort+' · '+ch.ability;
  updateWpnUI();setHP(hp);
}

function startGame(ch){
  G.state='playing';G.char=ch;
  initGame(ch);
  screenEl.style.display='none';
  hudEl.style.display='flex';
  if(raf)cancelAnimationFrame(raf);
  let lastT=performance.now();
  function loop(t){
    const dt=t-lastT;lastT=t;
    if(dt<200)update();
    draw();raf=requestAnimationFrame(loop);
  }
  raf=requestAnimationFrame(loop);
}

function updateWpnUI(){
  for(let i=0;i<4;i++) document.getElementById('ws'+i).classList.toggle('on',i===curWpn);
  wpnEl.textContent=WPNS[curWpn].name;wpnEl.style.color=WC[curWpn];
}

function setHP(v){
  const ch=P?P.char:G.char;
  const mx=ch?ch.maxHp:100;
  hp=clamp(v,0,mx);
  hpBarEl.style.width=(hp/mx*100)+'%';
  const pct=hp/mx;
  hpBarEl.style.background=pct>.55?'linear-gradient(90deg,#dc2626,#f87171)':pct>.28?'linear-gradient(90deg,#b45309,#fbbf24)':'linear-gradient(90deg,#7f1d1d,#ef4444)';
}

function spawnZombie(){
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=rnd(0,W);y=-22;}
  else if(side===1){x=W+22;y=rnd(0,H);}
  else if(side===2){x=rnd(0,W);y=H+22;}
  else{x=-22;y=rnd(0,H);}
  const mhp=3+Math.floor(wave/2);
  zombies.push({x,y,r:13,hp:mhp,maxHp:mhp,spd:.44+wave*.055+Math.random()*.18,wobble:rnd(0,Math.PI*2),hitFlash:0});
}

function spawnPack(){
  if(hpPacks.length<4) hpPacks.push({x:rnd(55,W-55),y:rnd(65,H-55),r:14,pulse:0});
}

function addPtcls(x,y,col,n,spd=2.5){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=rnd(.4,spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rnd(1.5,3.5),col});
  }
}

function shoot(){
  const w=WPNS[curWpn];
  const ch=P.char;
  const dmg=Math.round(w.dmg*ch.dmgMult);
  const a=Math.atan2(mouse.y-P.y,mouse.x-P.x);
  const sp=a+(Math.random()-.5)*w.spread*2;
  const ox=Math.cos(a)*20,oy=Math.sin(a)*20;
  bullets.push({x:P.x+ox,y:P.y+oy,vx:Math.cos(sp)*w.spd,vy:Math.sin(sp)*w.spd,angle:a,life:1,dmg,col:w.tracer,sz:w.sz});
  muzzles.push({x:P.x+ox,y:P.y+oy,angle:a,life:1,sz:w.id===2?18:w.id===3?8:11+Math.random()*6,col:w.tracer});
}

function update(){
  if(G.state!=='playing') return;
  waveTick++;
  if(waveTick>660){waveTick=0;wave++;waveEl.textContent='WAVE '+wave;}

  // Alok regen
  if(P.char.id==='alok'){
    regenTimer++;
    if(regenTimer>=120){regenTimer=0;setHP(hp+1);}
  }

  let dx=0,dy=0;
  if(keys.KeyW||keys.ArrowUp)dy=-1;
  if(keys.KeyS||keys.ArrowDown)dy=1;
  if(keys.KeyA||keys.ArrowLeft)dx=-1;
  if(keys.KeyD||keys.ArrowRight)dx=1;
  if(dx&&dy){dx*=.707;dy*=.707;}
  P.x=clamp(P.x+dx*P.spd,P.r,W-P.r);
  P.y=clamp(P.y+dy*P.spd,P.r,H-P.r);
  P.angle=Math.atan2(mouse.y-P.y,mouse.x-P.x)-Math.PI/2;

  if(mouse.down){shootCd--;if(shootCd<=0){shootCd=WPNS[curWpn].cd;shoot();}}
  else shootCd=0;

  spawnCd--;if(spawnCd<=0){spawnCd=Math.max(14,70-wave*6);spawnZombie();if(wave>3)spawnZombie();}
  packCd--;if(packCd<=0){packCd=270+Math.random()*180;spawnPack();}

  bullets=bullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;b.life-=.011;
    if(b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40) return false;
    for(let i=zombies.length-1;i>=0;i--){
      const z=zombies[i];
      if(dist(b,z)<z.r+4){
        z.hp-=b.dmg;z.hitFlash=7;
        addPtcls(b.x,b.y,b.col,4,1.8);
        if(z.hp<=0){
          addPtcls(z.x,z.y,'#4ade80',10,3);addPtcls(z.x,z.y,'#7f1d1d',5,2);
          zombies.splice(i,1);score+=10*wave;scoreEl.textContent=score;
        }
        if(b.dmg<99) return false;
      }
    }
    return true;
  });

  muzzles=muzzles.filter(m=>{m.life-=.2;return m.life>0;});
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.88;p.vy*=.88;p.life-=.04;return p.life>0;});

  zombies.forEach(z=>{
    const a=Math.atan2(P.y-z.y,P.x-z.x);
    z.x+=Math.cos(a)*z.spd;z.y+=Math.sin(a)*z.spd;
    z.wobble+=.08;if(z.hitFlash>0)z.hitFlash--;
    if(dist(z,P)<P.r+z.r-5){setHP(hp-.25);if(hp<=0)endGame();}
  });

  hpPacks=hpPacks.filter(pk=>{
    pk.pulse+=.08;
    if(dist(pk,P)<P.r+pk.r){
      setHP(hp+P.char.hpPackHeal);
      addPtcls(pk.x,pk.y,'#f43f5e',14,3);
      return false;
    }
    return true;
  });
}

// ─── DRAWING ────────────────────────────────────────────────────────────────
function drawBG(){
  ctx.fillStyle='#06090f';ctx.fillRect(0,0,W,H);
  const sg=ctx.createLinearGradient(0,0,0,H*.52);
  sg.addColorStop(0,'#070b14');sg.addColorStop(1,'#0f1a28');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*.52);
  ctx.save();ctx.globalAlpha=.55;ctx.fillStyle='#c8c87a';ctx.beginPath();ctx.arc(600,48,24,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#07090d';ctx.beginPath();ctx.arc(593,43,22,0,Math.PI*2);ctx.fill();ctx.restore();
  const t=Date.now()/5000;
  ctx.save();ctx.globalAlpha=.065;ctx.fillStyle='#8899bb';
  [0,1,2,3].forEach(i=>{ctx.beginPath();ctx.ellipse(90+i*160+Math.sin(t+i)*20,H*.37+Math.sin(t*1.3+i)*8,170,36,0,0,Math.PI*2);ctx.fill();});
  ctx.restore();
  [[0,168,56,H],[60,205,50,H],[115,172,64,H],[185,196,50,H],[390,196,52,H],[447,180,58,H],[510,165,70,H],[584,172,64,H],[652,190,50,H]].forEach(([x,y,w,h])=>{
    ctx.fillStyle='#0c1420';ctx.fillRect(x,y,w,h-y);
    ctx.strokeStyle='#16202e';ctx.lineWidth=.5;ctx.strokeRect(x,y,w,h-y);
    for(let wy=y+14;wy<h-20;wy+=20) for(let wx=x+8;wx<x+w-8;wx+=14)
      ctx.fillStyle=Math.random()>.65?'#c8922244':'#18243a',ctx.fillRect(wx,wy,5,7);
  });
  drawBigBen(265,88);
  const gg=ctx.createLinearGradient(0,H*.51,0,H);
  gg.addColorStop(0,'#182030');gg.addColorStop(1,'#0f1520');
  ctx.fillStyle=gg;ctx.fillRect(0,H*.51,W,H*.49);
  ctx.save();ctx.strokeStyle='#253040';ctx.lineWidth=1.5;ctx.setLineDash([22,16]);
  ctx.beginPath();ctx.moveTo(0,H*.7);ctx.lineTo(W,H*.7);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  [105,310,510].forEach(lx=>{
    const ly=H*.51;
    ctx.strokeStyle='#3a4d5e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(lx,ly+8);ctx.lineTo(lx,ly+85);ctx.stroke();
    ctx.strokeStyle='#4a5f70';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(lx,ly+8);ctx.quadraticCurveTo(lx+22,ly-8,lx+34,ly);ctx.stroke();
    ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#ffff99';ctx.beginPath();ctx.arc(lx+34,ly,4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.05;ctx.fillStyle='#ffff66';ctx.beginPath();ctx.arc(lx+34,ly,46,0,Math.PI*2);ctx.fill();ctx.restore();
  });
}

function drawBigBen(cx,by){
  ctx.fillStyle='#0c1620';
  ctx.fillRect(cx-20,by+82,40,H-by-82);ctx.fillRect(cx-15,by+42,30,46);
  ctx.fillRect(cx-18,by+22,36,24);ctx.fillRect(cx-22,by+32,7,22);ctx.fillRect(cx+15,by+32,7,22);
  ctx.beginPath();ctx.moveTo(cx-11,by+22);ctx.lineTo(cx+11,by+22);ctx.lineTo(cx,by-28);ctx.closePath();ctx.fill();
  ctx.fillStyle='#182535';ctx.beginPath();ctx.arc(cx,by+34,11,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2a3d50';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,by+34,11,0,Math.PI*2);ctx.stroke();
  const tt=Date.now()/1000;
  ctx.strokeStyle='#4a6a80';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx,by+34);ctx.lineTo(cx+Math.cos(tt*.5-Math.PI/2)*8,by+34+Math.sin(tt*.5-Math.PI/2)*8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,by+34);ctx.lineTo(cx+Math.cos(tt*3-Math.PI/2)*6,by+34+Math.sin(tt*3-Math.PI/2)*6);ctx.stroke();
}

function drawPlayer(){
  const ch=P.char;
  ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.angle);
  ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,8,13,5,0,0,Math.PI*2);ctx.fill();ctx.restore();
  const lk=keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD;
  const lt=Date.now()*.007;
  [-6,6].forEach((ox,i)=>{
    ctx.fillStyle=ch.color+'88';ctx.beginPath();ctx.ellipse(ox,14+(lk?Math.sin(lt+i*Math.PI)*5:0),4,7,0,0,Math.PI*2);ctx.fill();
  });
  // Body with character color
  ctx.fillStyle=ch.color+'44';ctx.beginPath();ctx.ellipse(0,1,11,14,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=ch.color;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,1,11,14,0,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=ch.color+'aa';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-4,-3);ctx.lineTo(0,-9);ctx.lineTo(4,-3);ctx.stroke();
  // Weapon
  const wc=WC[curWpn];
  ctx.fillStyle='#3a2a18';
  if(curWpn===0){ctx.fillRect(9,-5,24,5);ctx.fillStyle='#2a1a08';ctx.fillRect(14,-3,7,9);ctx.fillStyle='#888';ctx.fillRect(31,-3,8,2);}
  else if(curWpn===1){ctx.fillRect(9,-5,28,5);ctx.fillStyle='#2a1a08';ctx.fillRect(16,-3,8,9);ctx.fillStyle='#666';ctx.fillRect(35,-4,10,3);}
  else if(curWpn===2){ctx.fillStyle='#2a1808';ctx.fillRect(8,-4,36,4);ctx.fillStyle='#1a0f05';ctx.fillRect(10,-6,10,3);ctx.fillStyle='#999';ctx.fillRect(40,-3,12,2);ctx.fillStyle='#555';ctx.fillRect(14,-8,4,4);}
  else{ctx.fillRect(9,-4,18,5);ctx.fillStyle='#2a1a08';ctx.fillRect(12,-2,6,8);ctx.fillStyle='#888';ctx.fillRect(25,-3,7,2);}
  ctx.save();ctx.globalAlpha=.5;ctx.strokeStyle=wc;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(10,-2);ctx.lineTo(curWpn===2?44:curWpn===1?36:28,-2);ctx.stroke();ctx.restore();
  // Head
  ctx.fillStyle='#c8956a';ctx.beginPath();ctx.arc(0,-15,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-18,9,Math.PI,0);ctx.fill();ctx.fillRect(-9,-20,18,5);
  ctx.fillStyle='rgba(5,10,20,0.88)';ctx.fillRect(-7,-16,5,3.5);ctx.fillRect(2,-16,5,3.5);
  ctx.strokeStyle=ch.color+'66';ctx.lineWidth=.7;ctx.strokeRect(-7,-16,5,3.5);ctx.strokeRect(2,-16,5,3.5);
  // Character ability glow ring
  ctx.save();ctx.globalAlpha=.18;ctx.strokeStyle=ch.color;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();ctx.restore();
  ctx.restore();
}

function drawZombie(z){
  ctx.save();ctx.translate(z.x,z.y);
  const a=Math.atan2(P.y-z.y,P.x-z.x);ctx.rotate(a+Math.PI/2);
  ctx.translate(0,Math.sin(z.wobble)*2.5);
  ctx.save();ctx.globalAlpha=.22;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,9,11,4,0,0,Math.PI*2);ctx.fill();ctx.restore();
  const fl=z.hitFlash>0;
  ctx.fillStyle=fl?'#aaffaa':'#2d5a27';ctx.beginPath();ctx.ellipse(0,2,9,12,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=fl?'#fff':'#1a3a14';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(0,2,9,12,0,0,Math.PI*2);ctx.stroke();
  if(!fl){ctx.strokeStyle='#1a3a14';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(-2,6);ctx.moveTo(3,-2);ctx.lineTo(5,4);ctx.stroke();}
  ctx.fillStyle=fl?'#aaffaa':'#2d5a27';
  ctx.beginPath();ctx.ellipse(-13,0,4,9,Math.PI*.18,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(13,0,4,9,-Math.PI*.18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=fl?'#ccffcc':'#3a7032';ctx.beginPath();ctx.arc(0,-14,8.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff2222';ctx.beginPath();ctx.arc(-3.2,-14,2.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3.2,-14,2.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3.2,-15,1.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(3.2,-15,1.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#882222';ctx.beginPath();ctx.arc(0,-10,3,0,Math.PI);ctx.fill();
  ctx.fillStyle='#ddddbb';ctx.fillRect(-4,-11,3,3);ctx.fillRect(1,-11,3,3);
  const pct=z.hp/z.maxHp;
  ctx.fillStyle='#200';ctx.fillRect(-11,-27,22,4);
  ctx.fillStyle=pct>.6?'#33ff33':pct>.3?'#ffaa00':'#ff3333';ctx.fillRect(-11,-27,22*pct,4);
  ctx.restore();
}

function drawBullet(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);
  const len=b.dmg>=99?24:b.dmg>=4?14:10;
  ctx.save();ctx.globalAlpha=.2;ctx.strokeStyle=b.col;ctx.lineWidth=b.sz*2.2;ctx.beginPath();ctx.moveTo(-len,0);ctx.lineTo(0,0);ctx.stroke();ctx.restore();
  ctx.strokeStyle=b.col;ctx.lineWidth=b.sz;ctx.beginPath();ctx.moveTo(-len+2,0);ctx.lineTo(2,0);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(2,0,b.sz*.8,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawMuzzle(m){
  ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.angle);ctx.globalAlpha=m.life*.85;
  ctx.fillStyle=m.col;ctx.beginPath();
  for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2,r=i%2===0?m.sz:m.sz*.38;i===0?ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r):ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,m.sz*.22,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawParticles(){
  particles.forEach(p=>{ctx.save();ctx.globalAlpha=p.life*.85;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();ctx.restore();});
}

function drawHPPacks(){
  hpPacks.forEach(pk=>{
    const sc=.9+Math.sin(pk.pulse)*.1;
    ctx.save();ctx.translate(pk.x,pk.y);ctx.scale(sc,sc);
    ctx.save();ctx.globalAlpha=.18+Math.sin(pk.pulse)*.08;ctx.fillStyle='#f43f5e';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#f43f5e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#ef4444';ctx.fillRect(-7,-3,14,6);ctx.fillRect(-3,-7,6,14);
    ctx.restore();
  });
}

function drawVignette(){
  const vg=ctx.createRadialGradient(W/2,H/2,H*.22,W/2,H/2,H*.76);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.58)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

function draw(){
  if(G.state==='select'||G.state==='gameover'){drawBG();drawVignette();return;}
  drawBG();drawParticles();drawHPPacks();
  zombies.forEach(drawZombie);
  drawPlayer();
  bullets.forEach(drawBullet);
  muzzles.forEach(drawMuzzle);
  drawVignette();
}

function endGame(){
  G.state='gameover';
  screenEl.style.display='flex';
  const ch=G.char;
  screenEl.innerHTML=`
    <div class="title" style="font-size:26px">MISSION FAILED</div>
    <div class="subtitle" style="color:${ch.color};letter-spacing:2px;font-size:12px;margin-bottom:6px">${ch.name} HAS FALLEN</div>
    <div class="go-stat">SCORE: ${score} &nbsp;|&nbsp; WAVE: ${wave}</div>
    <button class="go-btn ready" id="go-btn">SELECT CHARACTER</button>`;
  const b=document.getElementById('go-btn');
  b.addEventListener('mouseover',()=>{b.style.background='#ef4444';b.style.color='#000';});
  b.addEventListener('mouseout',()=>{b.style.background='transparent';b.style.color='#ef4444';});
  b.addEventListener('click',()=>{hudEl.style.display='none';showSelectScreen();});
}

document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(G.state==='playing'){
    ['Digit1','Digit2','Digit3','Digit4'].forEach((k,i)=>{if(e.code===k){curWpn=i;updateWpnUI();}});
  }
});
document.addEventListener('keyup',e=>keys[e.code]=false);
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
C.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true;});
C.addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false;});
C.addEventListener('contextmenu',e=>e.preventDefault());

// Boot
showSelectScreen();
(function menuBG(){if(G.state!=='playing')draw();requestAnimationFrame(menuBG);})();
</script>
